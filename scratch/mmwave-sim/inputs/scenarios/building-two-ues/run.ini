# =============================================================================
# building-two-ues — differential building blockage check
#
# Purpose: verify that two UEs starting at the same position experience
# different metrics when one stays blocked by a building while the other
# moves into LOS.
#
# Same building geometry as building-bypass (x=40..70, y=-20..20, z=0..20).
#
#   ue0:  fixed at (80, 0, 1.6) — stays permanently NLOS behind the building
#   ue1:  starts at (80, 0, 1.6), moves at +20 m/s in y → exits shadow ~t=2 s
#         (LOS path clears building y_max=20 once ue y > 40, i.e. t > 2 s)
#
# Expected behaviour:
#   - ue0 and ue1 start identical (same SINR at t=0)
#   - ue1 SINR improves sharply at ~t=2 s when it clears the building
#   - summary.json: ue1 mean_sinr_db >> ue0 mean_sinr_db (ue1 spends 3/5 of
#     the run in LOS; ue0 is always NLOS)
#   - ue1 dl_throughput_mbps > ue0 dl_throughput_mbps
# =============================================================================

[scenario]
name           = building-two-ues
seed           = 42
run_id         = 1
duration_s     = 10.0
warmup_s       = 1.0
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMa
channel_model    = 3gpp
blockage_enabled = false

# =============================================================================
# NYU channel model parameters — only applied when channel_model = nyu
# All values are NYUSim defaults. Uncomment and edit to override.
# =============================================================================
[nyu_channel]
# rf_bandwidth_mhz         = 800.0    # RF bandwidth (MHz); affects subpath resolution
# shadowing_enabled         = true     # Log-normal shadow fading
# pressure_mbar             = 1013.25  # Barometric pressure (mbar)
# humidity_pct              = 50.0     # Relative humidity (%)
# temperature_c             = 20.0     # Temperature (°C)
# rain_rate_mm_hr           = 0.0      # Rain rate (mm/hr); 0 = no rain
# atmospheric_loss_enabled  = false    # Molecular/atmospheric absorption loss
# foliage_loss_enabled      = false    # Foliage penetration loss
# foliage_loss_db_m         = 0.4      # Foliage attenuation (dB/m)
# o2i_loss_type             = Low Loss # O2I penetration type: "Low Loss" or "High Loss"

[traffic]
direction                = dl
packet_size_bytes        = 1400
inter_packet_interval_us = 10000.0
app_start_offset_s       = 0.1
max_packets              = 0

[network]
backhaul_data_rate = 100Gb/s
backhaul_delay_ms  = 10.0

[output]
viz_tick_ms  = 500
pcap_enabled = false
