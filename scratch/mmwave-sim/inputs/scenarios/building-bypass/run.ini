# =============================================================================
# building-bypass — LOS/NLOS transition check
#
# Purpose: verify that the building blockage model correctly transitions a UE
# from NLOS to LOS as it moves out from behind a building.
#
# Geometry (top-down view):
#
#                           building (x=40..70, y=-20..20)
#   eNB (0,0)              ████████████
#         ·····NLOS·····  ████████████  ·········LOS·········>
#                          ████████████
#                                        ue0 starts at (80, 0) → moves +y
#
# The straight-line path from eNB(0,0,10) to ue0(80,0,1.6) passes through
# the building (at x=40, y≈0 — inside the building's y range [-20,20]).
# As ue0 moves in the +y direction the path eventually clears the building.
# The UE exits the building's shadow when y > 40 (approx. t=2 s at 20 m/s).
#
# Expected behavior:
#   t=0.0–2.0 s:  ue0 NLOS → high path loss, low SINR
#   t=2.0–5.0 s:  ue0 LOS  → path loss drops ~10–20 dB, SINR improves sharply
#   links.csv condition column should flip from "NLOS" to "LOS" around t≈2 s
# =============================================================================

[scenario]
name           = building-bypass
seed           = 42
run_id         = 1
duration_s     = 600.0
warmup_s       = 1.0
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMa
blockage_enabled = false

[traffic]
direction                = dl
packet_size_bytes        = 1400
inter_packet_interval_us = 10000.0
app_start_offset_s       = 0.1
max_packets              = 0

[network]
backhaul_data_rate = 100Gb/s
backhaul_delay_ms  = 10.0

[output]
viz_tick_ms  = 10000
pcap_enabled = false
