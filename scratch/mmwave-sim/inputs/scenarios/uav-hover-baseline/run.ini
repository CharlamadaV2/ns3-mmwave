# This scenario maps the 2-UAV link as follows:
#   enb0 = UAV-A  (mmWave "anchor" — runs downlink scheduler, connected to EPC)
#   ue0  = UAV-B  (mmWave "client" — attaches to enb0, receives scheduled DL)
#
# The role asymmetry is a simulator constraint, not a physical one. Both nodes
# are placed at identical altitude. Channel physics (path loss, LOS/NLOS, SINR,
# atmospheric absorption, beamforming) are fully and correctly modeled for this
# eNB<->UE air link regardless of node role labels.
#
# Traffic routing: ue0 -> enb0 -> [EPC wire] -> remote host (UL)
#                  remote host -> [EPC wire] -> enb0 -> ue0 (DL)
# The EPC wire (backhaul_data_rate) is set to 100 Gb/s so it is never the
# bottleneck — the mmWave air segment is the limiting factor as intended.
#
# ─── TEST PROCEDURE MAPPING ───────────────────────────────────────────────────
# Step 2: 60s beam stabilization      -> warmup_s = 60.0
#         Metrics before warmup_s are excluded from summary.json aggregation.
#
# Step 3: 5-min data collection       -> 300s of post-warmup simulation time
#         VizWriter logs SINR, LOS/NLOS, distance at 1 Hz (viz_tick_ms = 1000)
#         RLC stats give per-UE throughput and delay for the full post-warmup period
#
# Step 4: Bidirectional iPerf (2 min) -> direction = both; DL + UL run
#         simultaneously for the full sim duration (not sequentially).
#         ns3 cannot change traffic parameters mid-simulation without custom
#         application scheduling — sequential DL-then-UL phases are not modeled.
#         The offered load (inter_packet_interval_us) is set to approximate
#         iPerf UDP saturation behavior.
#         TCP iPerf is not available — ns3-mmwave traffic model is UDP only.
#
# Step 5: Latency test (1000 pings)   -> NOT directly modeled.
#         Approximation: DL delay mean in summary.json per_ue[ue0].dl_delay_mean_ms
#         gives one-way application-layer latency. True round-trip ping requires
#         custom ICMP echo apps and is not implemented in this harness.
#
# Step 7: 30s idle between tests      -> NOT modeled.
#         ns3 has no mid-simulation idle phase without custom app scheduling.
#         Consider running a separate low-rate scenario for idle characterization.
#
# ─── NOT MODELED (simulator limitations) ──────────────────────────────────────
# - GPS satellite acquisition (>=8 sats): all ns3 nodes are perfectly time-synced
# - Wind < 15 kts platform stability: no mechanical perturbation or hover jitter
# - Rotor-induced Doppler / body shadowing: no UAV platform geometry model
# - Pre-test RF spectrum scan: clean spectrum (no external interferers) assumed
# - TCP congestion control in iPerf: UDP-only traffic model
# - Idle-link capture windows between test phases
# - Beamforming training overhead (the 60s warmup approximates this implicitly)
#
# ─── ALTITUDE / SEPARATION MATRIX ────────────────────────────────────────────
# Spec calls for 3 altitudes x 4 separations = 12 configurations.
# This file is the BASELINE configuration: 60m AGL, 250m separation.
#
# To run other combinations, edit nodes.json z and x values:
#   Altitudes (z):    30.0m | 60.0m | 120.0m  (AGL — both enb0 and ue0)
#   Separations (x): 100.0m | 250.0m | 500.0m | 1000.0m
#
# All 12 combinations can be automated via --positions-override JSON:
#   {"enb0": [0, 0, <z>], "ue0": [<sep>, 0, <z>]}
# or by running run_sweep.py with a custom positions sweep.
# =============================================================================

[scenario]
name       = uav-hover-baseline
seed       = 42
run_id     = 1
# Duration breakdown:
#   60s  warmup_s   = beam stabilization (Step 2); excluded from all metric aggregation
#   300s            = 5-min data collection window (Step 3)
#   120s            = iPerf-equivalent saturation period (Step 4, bidirectional)
# Total: 480s (8 min). Steps 5 and 7 are not separately modeled — see notes above.
duration_s     = 480.0
;warmup_s       = 60.0
;duration_s     = 10.0
warmup_s       = 1.0
nodes_file     = nodes.json
buildings_file =

[channel]
# INFERRED: 28 GHz — not specified in the test procedure.
# Rationale: most common sub-THz mmWave band in UAV mesh research; matches
# existing NYU 28 GHz outdoor measurement campaigns used to derive RMa coefficients.
# Alternatives: 73 GHz (also NYU-measured, higher path loss), 60 GHz (use 3gpp model,
# significant O2 absorption ~15 dB/km). Change to 73.0 for higher-frequency runs.
frequency_ghz    = 28.0

# INFERRED: 30 dBm — not specified.
# Rationale: typical conducted TX power for compact UAV mmWave radios.
# Represents ~1W conducted power; accounts for cable/connector loss to antenna.
# Adjust downward (e.g., 23 dBm) if hardware spec calls for lower EIRP.
tx_power_dbm     = 30.0

# RMa (Rural Macro) — correct for open-field hover with no urban clutter.
# UMa (used in other scenarios) assumes dense urban ISD ~500m and is wrong here.
# RMa yields near-certain LOS probability at UAV altitudes with no buildings,
# and uses path loss exponents from low-clutter outdoor measurements.
scenario         = RMa

# NYU channel model preferred over 3gpp for aerial mmWave:
# (1) atmospheric absorption is a first-class tunable parameter
# (2) RMa coefficients derived from NYU 28/73 GHz outdoor campaigns
# (3) explicit subpath/cluster structure captures beamforming spatial behavior
# Use channel_model = 3gpp for a direct comparison run if needed.
channel_model    = nyu

# Open field hover, no buildings present -> LOS blockage from structures = 0.
# Rotor body shadowing and UAV platform effects are NOT modeled regardless of
# this setting (no UAV geometry exists in ns3-mmwave).
blockage_enabled = false

# Performance tuning — currently using defaults pending investigation.
# channel_update_period_ms    = 5000
# condition_update_period_ms  = 5000
# beamforming_model           = dft
# cqi_period_slots            = 80
# amc_model                   = shannon

[nyu_channel]
# INFERRED: 800 MHz — not specified.
# Rationale: standard allocation for 28 GHz mmWave; consistent with 3GPP NR FR2
# channel bandwidth (up to 400 MHz per CC; 800 MHz = 2-CC aggregation).
# Affects subpath delay resolution in NYU model. Adjust if hardware BW known.
rf_bandwidth_mhz        = 800.0

# Log-normal shadow fading: enabled even for LOS — physically correct outdoor behavior.
# NYU RMa sigma_SF ~1.7 dB (LOS) per empirical measurements.
shadowing_enabled        = true

# Standard ISA atmosphere at ~60m AGL. Test conditions not specified beyond
# "wind < 15 kts" — neutral atmosphere defaults are appropriate.
pressure_mbar            = 1013.25
humidity_pct             = 50.0
temperature_c            = 20.0

# No precipitation — fair-weather implied by wind < 15 kts flight condition.
rain_rate_mm_hr          = 0.0

# Atmospheric absorption ENABLED: at 28 GHz in clear air, O2 absorption is
# ~0.007 dB/km — small but non-zero. Enabled for physical correctness at 1km separation.
# At 60 GHz this becomes ~15 dB/km and would be dominant; 28 GHz is negligible at
# short ranges but correct to include for the 1km configuration.
atmospheric_loss_enabled = true

# No vegetation — open field scenario has no foliage in propagation path.
foliage_loss_enabled     = false
foliage_loss_db_m        = 0.4

# O2I (outdoor-to-indoor) penetration: not applicable — both UAVs are outdoors.
# This parameter has no effect when neither node is inside a building geometry.
o2i_loss_type            = Low Loss

[traffic]
# Both directions simultaneously — approximates bidirectional iPerf (Step 4).
# DL = eNB(UAV-A) -> UE(UAV-B), UL = UE(UAV-B) -> eNB(UAV-A).
# NOTE: these run concurrently, not sequentially. True iPerf runs one direction
# at a time for clean throughput measurement. Concurrent DL+UL shares scheduler
# resources and may show slightly lower per-direction throughput than sequential.
direction                = both

# Standard Ethernet MTU payload — matches iPerf UDP default packet size.
packet_size_bytes        = 1400

# INFERRED: 1000 us (1ms interval = 1000 pps per direction = ~11.2 Mbps offered).
# Rationale: aggressive enough to stress the scheduler and reveal link capacity
# without causing memory overflow on marginal links (500m, 1km at lower SINR).
# For close LOS links (100m, 60m AGL) theoretical capacity >> 11 Mbps; the
# scheduler will be the bottleneck — this is the correct iPerf-like behavior.
# To truly saturate a strong LOS link, reduce to inter_packet_interval_us = 100.0
# (10000 pps ~112 Mbps offered) but watch for queue buildup at weaker links.
inter_packet_interval_us = 1000.0

# App starts 0.1s after sim start (well within the 60s warmup window).
# MetricsWriter excludes all samples before warmup_s from aggregation.
app_start_offset_s       = 0.1

# Unlimited — run at full offered rate for entire duration.
# The scheduler, not this limit, determines actual throughput.
max_packets              = 0

[network]
# 100 Gb/s wire — intentionally not the bottleneck.
# The EPC backhaul is a PointToPoint wire link (no RF physics). Setting it to
# 100 Gb/s ensures the mmWave air segment (enb0 <-> ue0) is always the
# capacity-limiting element, which is the physically correct behavior for
# characterizing the UAV-to-UAV mmWave link.
backhaul_data_rate = 100Gb/s

# Minimal wire delay — not intended to represent any real network segment.
# In a true mesh scenario, UAV-to-UAV relay traffic would incur additional
# over-the-air hop latency not captured here.
backhaul_delay_ms  = 1.0

[output]
# 1000 ms = 1 Hz tick rate — satisfies "log all RF and network metrics at
# 1 Hz minimum" from Step 3. Produces one row/second in positions.csv + links.csv.
viz_tick_ms  = 1000

# PCAP disabled — keeps output manageable for an 8-minute run.
# Enable (true) to capture raw UDP packet traces for detailed latency inspection
# or per-packet delivery analysis (approximate Step 5 ping-RTT characterization).
pcap_enabled = false
# trace_level  = minimal
