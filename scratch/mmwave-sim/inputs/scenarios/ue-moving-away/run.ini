# =============================================================================
# ue-moving-away — connectivity range sanity check
#
# Purpose: verify that the simulation correctly degrades signal and eventually
# loses connectivity as a UE moves away from a single base station.
#
# Topology: 1 eNB at (0,0,10), 1 UE starting at 20 m and moving at 30 m/s in
# the +x direction.  Over 9 s of active time the UE travels from 20 m to ~290 m.
#
# Expected behaviour:
#   - Near field (~20–80 m):   strong signal, high SINR
#   - Mid range (~80–200 m):   SINR degrades, MCS drops, throughput falls
#   - Far range (200+ m):      SINR drops sharply, outage begins
#
# LOS/NLOS is determined probabilistically by the 3GPP UMa model — LOS
# probability decreases with distance so a transition is expected mid-run.
# =============================================================================

[scenario]
name           = ue-moving-away
seed           = 42
run_id         = 1
duration_s     = 10.0
warmup_s       = 1.0
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMa
channel_model    = nyu
blockage_enabled = false

# =============================================================================
# NYU channel model parameters — only applied when channel_model = nyu
# All values are NYUSim defaults. Uncomment and edit to override.
# =============================================================================
[nyu_channel]
# RF bandwidth (MHz); affects subpath resolution
rf_bandwidth_mhz         = 800.0
# Log-normal shadow fading
shadowing_enabled         = true
# Barometric pressure (mbar)
pressure_mbar             = 1013.25
# Relative humidity (%)
humidity_pct              = 50.0
# Temperature (°C)
temperature_c             = 20.0
# Rain rate (mm/hr); 0 = no rain
rain_rate_mm_hr           = 0.0
# Molecular/atmospheric absorption loss
atmospheric_loss_enabled  = false
# Foliage penetration loss
foliage_loss_enabled      = false
# Foliage attenuation (dB/m)
foliage_loss_db_m         = 0.4
# O2I penetration type: "Low Loss" or "High Loss"
o2i_loss_type             = Low Loss

[traffic]
direction                = both
packet_size_bytes        = 1400
inter_packet_interval_us = 10000.0
app_start_offset_s       = 0.1
max_packets              = 0

[network]
backhaul_data_rate = 100Gb/s
backhaul_delay_ms  = 10.0

[output]
viz_tick_ms  = 500
pcap_enabled = false
