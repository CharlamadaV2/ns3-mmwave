# =============================================================================
# Test 1.2 — Straight-Line Flyaway Range Test
#
# Objective:
#   Map link performance as a function of range by flying one UAV directly away
#   from a fixed reference UAV until link failure, characterizing the
#   throughput-vs-distance curve and identifying the link budget cliff.
#
# Topology:
#   enb0 = UAV-A  (fixed reference, hovering at 60m AGL)
#   ue0  = UAV-B  (flyaway node, starts 50m out at 60m AGL, moves +x at 5 m/s)
#
# The role asymmetry (enb vs ue) is a simulator constraint, not physical.
# Both nodes are at identical altitude; channel physics (path loss, LOS/NLOS,
# SINR, atmospheric absorption, beamforming) are correctly modeled for this
# eNB<->UE air link regardless of role labels.
#
# Traffic routing: ue0 -> enb0 -> [EPC wire] -> remote host (UL)
#                  remote host -> [EPC wire] -> enb0 -> ue0 (DL)
# The EPC wire (backhaul_data_rate = 100 Gb/s) is never the bottleneck.
#
# ─── TEST PROCEDURE MAPPING ────────────────────────────────────────────────
# Step 1: Verify baseline at 50m        -> first ~10s of post-warmup data;
#         compare with 1.1 baseline summary.json metrics at equivalent range.
#
# Step 2: Begin outbound flight at 5 m/s -> constant_velocity mobility on ue0,
#         vx = 5.0 m/s. Node moves from x=50m at t=0 (post-warmup).
#         Distance from enb0 at any post-warmup time t: d(t) = 50 + 5*t metres.
#
# Step 3: Log all metrics at 1 Hz       -> viz_tick_ms = 1000 produces one
#         row/second in positions.csv + links.csv. RLC stats give per-UE
#         throughput and delay for post-warmup aggregation.
#
# Step 4: Mark throughput thresholds     -> NOT automatic in the harness.
#         Post-process: read links.csv, find distances where throughput crosses
#         75%, 50%, 25% of the baseline value (first ~10s mean or 1.1 summary).
#
# Step 5: Continue until link loss       -> simulated by running long enough
#         that SINR drops below decodable threshold. At 28 GHz RMa LOS with
#         30 dBm TX, link budget cliff is expected around 1.5–2.5 km depending
#         on shadow fading realisation.
#
# Step 6: Hold 30s after link loss       -> the simulation continues past link
#         loss. The 30s hold is captured in the tail of the trace — look for
#         the window where throughput = 0 persists for >=30 consecutive seconds.
#         No special sim configuration needed; the node keeps moving but the
#         extra distance is negligible for confirming stable link loss.
#
# Step 7: Return flight (reconnection)   -> NOT modeled in this run.
#         constant_velocity does not support waypoints or direction reversal.
#         To simulate the return leg, create a mirrored scenario:
#           - ue0 starts at the link-loss distance (read from this run's output)
#           - velocity: {"vx": -5.0, "vy": 0.0, "vz": 0.0}
#         This captures reconnection distance and reacquisition time.
#         Alternatively, use run_sweep.py with positions-override to sweep
#         inbound starting positions derived from this run's results.
#
# Step 8: Repeat 3x for statistics       -> use run_sweep.py seed sweep:
#           seeds: [42, 137, 256]  (or any 3+ distinct seeds)
#         Each seed produces a different shadow fading realisation, giving
#         statistical spread on the link budget cliff distance.
#
# ─── NOT MODELED (simulator limitations) ────────────────────────────────────
# - GPS satellite acquisition: all ns3 nodes are perfectly time-synced
# - Wind / platform stability: no mechanical perturbation or flight dynamics
# - Rotor-induced Doppler / body shadowing: no UAV platform geometry model
# - Pre-test RF spectrum scan: clean spectrum assumed (no external interferers)
# - TCP congestion control: UDP-only traffic model
# - Mid-sim direction reversal for return leg (see Step 7 above)
# - Doppler shift from 5 m/s radial motion: at 28 GHz, fd = v*f/c ≈ 467 Hz.
#   The NYU channel model does not apply Doppler spreading; only large-scale
#   fading and LOS/NLOS transitions capture the mobility effect. For sub-10 m/s
#   UAV speeds this is a minor omission.
# =============================================================================

[scenario]
name       = uav-flyaway-range
seed       = 42
run_id     = 1
# Duration breakdown:
#   60s   warmup_s  = beam stabilization + baseline verification window (Steps 1-2)
#   540s            = outbound flight; ue0 traverses 50m -> 2750m (2700m range)
#                     at 5 m/s. This comfortably exceeds the expected ~2km link
#                     budget cliff at 28 GHz / 30 dBm / RMa LOS, plus >=30s of
#                     post-link-loss hold time (Step 6).
# Total: 600s (10 min).
duration_s     = 300.0
;duration_s     = 10.0
;warmup_s       = 60.0
warmup_s       = 1.0
nodes_file     = nodes.json
buildings_file =

[channel]
# 28 GHz — same as 1.1 baseline for direct comparison.
frequency_ghz    = 28.0

# 30 dBm — same as 1.1 baseline.
tx_power_dbm     = 30.0

# RMa (Rural Macro) — open-field flight corridor, no urban clutter.
# The spec requires "minimum 2km unobstructed" LOS corridor; RMa yields
# near-certain LOS probability with no buildings, correctly modelling
# the free-space-like propagation expected in this test.
scenario         = RMa

# NYU channel model — same as 1.1 baseline for apples-to-apples comparison.
channel_model    = nyu

# No buildings in the flight corridor -> no structural blockage.
blockage_enabled = false

# ─── Mobile-scenario channel update tuning ──────────────────────────────────
# Unlike the static 1.1 baseline, the node is moving so the channel must be
# re-evaluated periodically. At 5 m/s the node moves 5m per second.
#
# channel_update_period_ms = 1000: recompute the full channel matrix every 1s
#   (5m displacement). This balances physical accuracy against computational
#   cost for a 10-minute run. Decrease to 200ms for finer granularity at the
#   expense of ~5x longer runtime.
#
# condition_update_period_ms = 1000: re-evaluate LOS/NLOS condition every 1s.
#   In pure RMa with no buildings, LOS probability is ~1.0 at UAV altitudes,
#   so this mainly affects shadow fading correlation distance.
channel_update_period_ms   = 1000
condition_update_period_ms = 1000

[nyu_channel]
# All parameters identical to 1.1 baseline for controlled comparison.
# The only variable in this test is range (separation distance).
rf_bandwidth_mhz        = 800.0
shadowing_enabled        = true
pressure_mbar            = 1013.25
humidity_pct             = 50.0
temperature_c            = 20.0
rain_rate_mm_hr          = 0.0

# Atmospheric absorption ENABLED — critical for range testing.
# At 28 GHz, O2 absorption is ~0.007 dB/km in clear air. Over 2.5 km this
# contributes ~0.018 dB — negligible for the link budget cliff but physically
# correct. If running at 60 GHz (O2 peak, ~15 dB/km) this becomes dominant.
atmospheric_loss_enabled = true

# No vegetation in flight corridor.
foliage_loss_enabled     = false
foliage_loss_db_m        = 0.4

# Both UAVs are outdoors — O2I not applicable.
o2i_loss_type            = Low Loss

[traffic]
# Bidirectional — same as 1.1 baseline for direct throughput comparison.
direction                = both

# Standard MTU payload.
packet_size_bytes        = 1400

# Same offered load as 1.1 baseline (1000 pps per direction, ~11.2 Mbps).
# This ensures throughput degradation is due to link quality, not a change in
# offered load. The throughput-vs-distance curve is meaningful only when the
# source rate is constant — the scheduler's ability to deliver packets is what
# we are measuring.
inter_packet_interval_us = 1000.0

# App starts well within the warmup window.
app_start_offset_s       = 0.1

# Unlimited — run for entire duration.
max_packets              = 0

[network]
# 100 Gb/s wire — not the bottleneck.
backhaul_data_rate = 100Gb/s
# Minimal wire delay.
backhaul_delay_ms  = 1.0

[output]
# 1 Hz logging — satisfies "log all metrics continuously at 1 Hz" (Step 3).
viz_tick_ms  = 1000

# PCAP disabled — 10-minute run at 1000 pps bidirectional would produce
# ~1.2M packets. Enable selectively for short sub-runs if per-packet
# analysis is needed.
pcap_enabled = false
# trace_level  = minimal
