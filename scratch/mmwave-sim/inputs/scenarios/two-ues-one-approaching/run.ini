# =============================================================================
# two-ues-one-approaching — differential coverage improvement check
#
# Purpose: verify that the simulation shows improving metrics for a UE that
# moves closer to the base station while a second UE remains far away.
#
# Topology: 1 eNB at origin.
#   ue0: fixed at (100, 30, 1.6) — stays far, baseline reference
#   ue1: starts at (150, 0, 1.6), moves at -10 m/s in y
#
# Expected behaviour:
#   - ue0 SINR stays roughly constant throughout
#   - ue1 sweeps in the y direction; distance from eNB increases gradually
#   - summary.json per_ue metrics should stay comparable between ue0 and ue1
# =============================================================================

[scenario]
name           = two-ues-one-approaching
seed           = 42
run_id         = 1
duration_s     = 10.0
warmup_s       = 1.0
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMa
blockage_enabled = false

[traffic]
direction                = dl
packet_size_bytes        = 1400
inter_packet_interval_us = 10000.0
app_start_offset_s       = 0.1
max_packets              = 0

[network]
backhaul_data_rate = 100Gb/s
backhaul_delay_ms  = 10.0

[output]
viz_tick_ms  = 500
pcap_enabled = false
