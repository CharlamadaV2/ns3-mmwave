# =============================================================================
# 15-umi-los-probability — how propagation scenario affects results
#
# Purpose: teaching scenario.  Identical to the baseline (01) except
# scenario = UMi (Urban Microcell / street canyon) instead of RMa.
# Compare outputs to 01 to see how the channel environment changes things.
#
# Knob changed from baseline (01): scenario = UMi.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (100, 0, 10) — fixed
#
# Why the results differ from 01:
#   UMi has a much more aggressive NLOS probability than RMa, even at 100m.
#   Without buildings, the 3GPP model uses a PROBABILISTIC condition model
#   that randomly assigns LOS or NLOS based on distance and scenario.  This
#   means different seeds may produce very different SINR values.
#
#   RMa (scenario 01) has near-100% LOS probability at 100m, so it always
#   gives a clean flat line.  UMi may or may not — that's the lesson.
#
#   Try running this scenario with seed=1, seed=2, seed=3 and compare.
#   Some runs will be LOS (similar to 01), others NLOS (much lower SINR).
#
# Expected behaviour:
#   - Time-series may still be flat (fixed geometry), but the SINR level
#     depends on the probabilistic LOS/NLOS draw for this seed
#   - If LOS: SINR similar to 01 but with UMi path loss (slightly different)
#   - If NLOS: SINR dramatically lower (~15-20 dB less)
#   - Shadow fading variance is higher than RMa (σ up to 7.82 dB for NLOS)
# =============================================================================

[scenario]
name           = 15-umi-los-probability
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
