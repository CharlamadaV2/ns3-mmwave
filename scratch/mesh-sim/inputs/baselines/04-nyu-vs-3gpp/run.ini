# =============================================================================
# 04-nyu-vs-3gpp — NYU channel model vs 3GPP comparison
#
# Purpose: validate the NYU propagation code path.  Uses the same RMa
# scenario as the baseline but switches to the NYU model with shadowing
# disabled.  Diff the outputs against scenario 05 (which adds rain) to
# isolate weather effects.
#
# Knob changed from baseline (01): channel_model = nyu (shadowing off).
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (500, 0, 10) — fixed
#
# Both scenarios 04 and 05 use 500m so that the atmospheric penalty in 05
# is clearly visible (~2.5-5 dB).  Compare 04 vs 05 to isolate rain loss.
#
# Expected behaviour:
#   - All time-series are flat horizontal lines (no shadowing, no mobility)
#   - SINR and capacity will differ from 01 due to different distance and
#     model; compare 04 vs 05 to isolate atmospheric effects
# =============================================================================

[scenario]
name           = 04-nyu-vs-3gpp
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = nyu
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[nyu_channel]
shadowing_enabled        = false
atmospheric_loss_enabled = false
foliage_loss_enabled     = false
rain_rate_mm_hr          = 0.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
