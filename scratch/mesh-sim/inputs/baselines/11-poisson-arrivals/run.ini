# =============================================================================
# 11-poisson-arrivals — random flow arrivals with expiry
#
# Purpose: validate Poisson traffic model with holding times.  Flows arrive
# randomly at ~2/second, each lasting ~3 seconds.  The number of concurrent
# flows should stabilize around ~6 (arrival_rate × holding_time).
#
# Knob changed from baseline (01): traffic model = poisson, 3 nodes.
#
#   node-a:  (0, 0, 10)         — fixed
#   node-b:  (100, 0, 10)       — fixed
#   node-c:  (50, 86.6, 10)     — fixed (equilateral triangle)
#
# Expected behaviour:
#   - flow_throughput: multiple lines appearing/disappearing over time
#   - Throughput ramps up then fluctuates around steady state
#   - All links strong (short distances, RMa LOS), delivery not the issue
#   - Validates Poisson arrival, holding time expiry, random_pairs topology
# =============================================================================

[scenario]
name           = 11-poisson-arrivals
seed           = 42
run_id         = 1
duration_s     = 20.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model              = poisson
demand_mbps        = 50.0
arrival_rate_hz    = 2.0
holding_time_s     = 3.0
flow_topology      = random_pairs
random_pair_count  = 1

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
