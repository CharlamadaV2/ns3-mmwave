# =============================================================================
# 10-on-off-traffic — bursty on/off duty cycle
#
# Purpose: validate on_off traffic model.  The flow alternates between ON
# (100 Mbps demand) and OFF (0 demand).  Durations are exponentially
# distributed with mean 2s.  The link is always strong (RMa LOS at 100m),
# so throughput tracks the traffic state exactly.
#
# Knob changed from baseline (01): traffic model = on_off.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (100, 0, 10) — fixed
#
# Expected behaviour:
#   - SINR/capacity: flat (physics unchanged by traffic state)
#   - flow_throughput: square-wave pattern, ~100 Mbps ON / 0 OFF
#   - per_flow_throughput: ~50 Mbps average (50% duty cycle)
# =============================================================================

[scenario]
name           = 10-on-off-traffic
seed           = 1
run_id         = 1
duration_s     = 30.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = on_off
demand_mbps    = 100.0
on_time_s      = 2.0
off_time_s     = 2.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
