[scenario]
name           = rl-relay-test
seed           = 1
run_id         = 1
duration_s     = 60.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = true
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model         = constant
demand_mbps   = 800.0
flow_topology = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[rl]
enabled             = true
controlled_node_id  = node-b
action_type         = discrete
reward_type         = mean_sinr
step_size_m         = 25.0
x_min               = 0.0
x_max               = 250.0
y_min               = -50.0
y_max               = 200.0

[output]
viz_tick_ms = 100
