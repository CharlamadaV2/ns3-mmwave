# =============================================================================
# 09-congestion-bottleneck — proportional fairness on a shared relay link
#
# Purpose: validate congestion scaling.  Two sources route through a relay
# drone to reach the destination.  The relay→dst link is the shared
# bottleneck.  Both flows should get an equal share (proportional fairness).
#
# Knob changed from baseline (01): buildings + high demand + gateway topology.
#
#   src-a:  (0, 50, 1.5)    — fixed, ground
#   src-b:  (0, -50, 1.5)   — fixed, ground
#   relay:  (100, 0, 40)    — fixed, drone at altitude (clears building)
#   dst:    (300, 0, 1.5)   — fixed, ground
#
#   Building: x=[150,180], y=[-80,80], z=[0,25]
#     — blocks direct src→dst paths (ground level)
#     — relay at 40m clears the 25m building
#
# Both flows: src-a→relay→dst and src-b→relay→dst
# relay→dst (~204m) is the shared bottleneck.
# Each flow demands 2000 Mbps.  Total demand on bottleneck: 4000 Mbps.
# Bottleneck capacity ≈ 3000 Mbps → each flow gets ~1500 Mbps.
#
# Expected behaviour:
#   - flow_throughput: both flows capped below 2000 Mbps (~1500 each)
#   - per_flow_throughput: roughly equal bars (proportional fairness)
#   - network_summary: sum_throughput ≈ bottleneck capacity, not 2×demand
# =============================================================================

[scenario]
name           = 09-congestion-bottleneck
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = true
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model            = constant
demand_mbps      = 2000.0
flow_topology    = gateway
gateway_node_id  = dst

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
