# =============================================================================
# 13-colocation-guard — co-location guard (distance < 1m)
#
# Purpose: validate the co-location special case in LinkEvaluator.  When
# two nodes are < 1m apart, path loss is forced to 0 and the propagation
# model is bypassed to avoid log10(0) issues.
#
# Knob changed from baseline (01): node distance = 0.5m (edge case).
#
#   node-a:  (0, 0, 10)     — fixed
#   node-b:  (0.5, 0, 10)   — fixed, 0.5m away
#
# Link budget at co-location:
#   path_loss = 0 dB
#   rx_power = 30 + 24.08 = 54.08 dBm
#   SINR = 54.08 - (-83) = 137.08 dB
#   Shannon capacity ≈ 400 * log2(1 + 10^13.7) ≈ 18,200 Mbps
#
# Expected behaviour:
#   - SINR: flat at ~137 dB (absurdly high — this is the guard, not reality)
#   - Capacity: flat at ~18,000 Mbps
#   - MCS: CQI 14
#   - Throughput: 10 Mbps (demand trivially met)
# =============================================================================

[scenario]
name           = 13-colocation-guard
seed           = 1
run_id         = 1
duration_s     = 2.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
