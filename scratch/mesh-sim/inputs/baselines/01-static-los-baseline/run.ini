# =============================================================================
# 01-static-los-baseline — link budget calibration at a known distance
#
# Purpose: simplest possible scenario — two fixed nodes, no mobility, no
# buildings. Every output graph should be a flat line. If anything isn't
# flat, the simulator has a time-dependent bug.
#
# This is the BASELINE configuration. Every other scenario changes exactly
# one knob from this setup, so you can always diff back to here.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (100, 0, 10) — fixed
#
# Why RMa?  Rural Macrocell has near-100% LOS probability at 100m and the
# lowest shadow fading variance (σ = 4 dB LOS).  With a fixed seed the
# shadow fading draw is constant, so the time-series is perfectly flat.
#
# Link budget (approximate):
#   RMa LOS PL at 100m, 28 GHz ≈ 91 dB
#   Rx power ≈ 30 - 91 + 24 = -37 dBm
#   Noise floor = -174 + 86 + 5 = -83 dBm
#   SINR ≈ -37 - (-83) = 46 dB  (±4 dB shadow fading)
#   Shannon capacity ≈ 400 * log2(1 + 10^4.6) ≈ 6100 Mbps
#
# Expected behaviour:
#   - All time-series plots are flat horizontal lines
#   - SINR ~42-50 dB, capacity ~5500-6500 Mbps
#   - MCS stuck at CQI 14 (highest)
#   - Flow throughput = 10 Mbps (demand fully met)
#   - Latency ≈ 0.5 ms (processing only, negligible propagation)
# =============================================================================

[scenario]
name           = 01-static-los-baseline
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
