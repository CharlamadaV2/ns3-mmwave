# =============================================================================
# p0-jammer-smoke — deterministic synthetic jammer coverage for the baseline regression.
#
# Three fixed-geometry drone peers plus one omnidirectional 2400 MHz jammer at
# (50, 0, 10). RL is disabled so binaries without RL support can run this fixture.
# The jammer path is active only when the run uses band sub-6.
# =============================================================================

[scenario]
name           = p0-jammer-smoke
seed           = 1
run_id         = 1
duration_s     = 0.4
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =
jammers_file   = jammers.json

[channel]
band             = sub-6
frequency_ghz    = 2.4
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
condition_model  = static_los
blockage_enabled = false
bandwidth_mhz    = 400.0
noise_figure_db  = 5.0

[traffic]
model         = constant
demand_mbps   = 10.0
flow_topology = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[rl]
enabled            = false
controlled_node_id = relay
action_type        = discrete
reward_type        = all_links_los
step_size_m        = 5.0
x_min              = 0.0
x_max              = 100.0
y_min              = -50.0
y_max              = 100.0
z_min              = 0.0
z_max              = 50.0

[output]
viz_tick_ms = 100
