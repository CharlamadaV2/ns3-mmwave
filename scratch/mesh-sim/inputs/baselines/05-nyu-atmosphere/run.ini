# =============================================================================
# 05-nyu-atmosphere — NYU channel model with atmospheric and rain loss
#
# Purpose: demonstrate the NYU atmospheric absorption and rain attenuation
# knobs.  Identical to scenario 04 except atmospheric_loss_enabled = true
# and rain_rate_mm_hr = 25.  Any SINR drop vs 04 is purely from weather.
#
# Knob changed from 04: atmospheric_loss_enabled + rain_rate_mm_hr.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (500, 0, 10) — fixed
#
# At 28 GHz, atmospheric absorption ≈ 0.1 dB/km, rain at 25 mm/hr adds
# ~5-10 dB/km.  Over 500m the combined penalty is ~2.5-5 dB — clearly
# visible when compared to 04's output.
#
# Expected behaviour:
#   - All time-series are flat (both fixed, no shadowing)
#   - SINR noticeably lower than scenario 04 by ~2.5-5 dB (rain penalty)
#   - Capacity correspondingly lower
# =============================================================================

[scenario]
name           = 05-nyu-atmosphere
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = nyu
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[nyu_channel]
shadowing_enabled        = false
atmospheric_loss_enabled = true
foliage_loss_enabled     = false
rain_rate_mm_hr          = 25.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
