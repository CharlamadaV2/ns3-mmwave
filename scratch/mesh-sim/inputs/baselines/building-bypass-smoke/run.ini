# =============================================================================
# building-bypass-smoke — diagnostic centralized RL smoke around one building
#
# Purpose: a tiny scenario where going north or south around the building is
# the fastest route to link LOS, making a reward signal visible. Action masks
# check bounds, not buildings: moving west through it also reaches LOS at x < 90.
# Diagnostic only: it is not a training campaign or a benchmark.
#
#   node-a:  (0, 0, 10)   — fixed, west of the building
#   node-b:  (200, 0, 10) — RL-controlled, east of the building
#
#   Building: x=[90,110], y=[-20,20], z=[0,30]
#
# Derived numbers:
#   - slot speed = min(step_size_m / tick_s, 20 m/s drone cap) = 20 m/s,
#     so one decision (1.0 s) moves node-b 20 m.
#   - duration_s / tick_s = 200 ticks; 20 decisions of 10 ticks each.
#   - C++ obs_dim 6, local_links_v1 obs_dim 8, mask_dim 5 (one slot).
#   - Both nodes start outdoors and the segment (0,0,10)->(200,0,10) crosses
#     the building, so the link starts NLOS.
#   - Clearing the building edge needs |y| * 90/200 > 20, i.e. |y| > 44.4;
#     moving north (or south, by symmetry) first reaches it at tick 23 (y = 46).
#
# Expected behaviour:
#   - hold every decision: the link stays NLOS, every decision reward is -1.0,
#     and the episode return is -20.0.
#   - north while the north action is unmasked: the first all-LOS decision is 4,
#     decisions 4..20 stay LOS, and north becomes masked at y = 100 (y_max).
# =============================================================================

[scenario]
name           = building-bypass-smoke
seed           = 1
run_id         = 1
duration_s     = 20.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
band             = mmwave
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = true
bandwidth_mhz    = 400.0
noise_figure_db  = 5.0

[traffic]
model         = constant
demand_mbps   = 10.0
flow_topology = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[rl]
enabled               = true
controlled_nodes      = node-b
max_controlled_nodes  = 1
action_profile        = move_2d
decision_interval_s   = 1.0
action_type           = discrete
reward_type           = all_links_los
step_size_m           = 2.0
x_min                 = 0.0
x_max                 = 250.0
y_min                 = -100.0
y_max                 = 100.0
z_min                 = 0.0
z_max                 = 50.0
observation_preset    = local_links_v1

[output]
viz_tick_ms = 100
