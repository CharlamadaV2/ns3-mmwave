# =============================================================================
# 02-distance-sweep — path loss vs distance, link death
#
# Purpose: node-b moves away from node-a at 20 m/s. Validates that SINR
# decreases monotonically, that the MCS staircase descends through all 15
# CQI levels, and that capacity/throughput hit 0 when SINR crosses -6.7 dB.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  starts (50, 0, 10) — moves east at 20 m/s
#
# Starting separation:  50 m
# Final separation:    ~2450 m  (50 + 20*120)
#
# RMa LOS at 28 GHz: link budget ≈ 137 dB max tolerable PL.
# Link should die somewhere around 1.5–2.5 km.
#
# Expected behaviour:
#   - SINR: smooth monotonic decline from ~45 dB → below -6.7 dB
#   - Capacity: smooth decline from ~6000 Mbps → 0
#   - MCS: staircase descent 14 → 13 → ... → 0
#   - Flow throughput: flat at 100 Mbps, drops when capacity < 100, then 0
#   - Latency: slight increase, then 0 when flow becomes unroutable
# =============================================================================

[scenario]
name           = 02-distance-sweep
seed           = 1
run_id         = 1
duration_s     = 120.0
warmup_s       = 0.0
tick_s         = 0.5
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 100.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 500
