# =============================================================================
# Centralized multi-node RL smoke scenario.
#
# Three drone peers; node-b and node-c are RL-controlled slots (node-a keeps
# its random walk). Band mmwave, no jammers.
# =============================================================================

[scenario]
name           = centralized-multi-smoke
seed           = 1
run_id         = 1
duration_s     = 1.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
band             = mmwave
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
condition_model  = static_los
blockage_enabled = false
bandwidth_mhz    = 400.0
noise_figure_db  = 5.0

[traffic]
model         = constant
demand_mbps   = 10.0
flow_topology = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[rl]
enabled               = true
controlled_nodes      = node-b, node-c
max_controlled_nodes  = 3
action_profile        = move_2d
decision_interval_s   = 0.5
action_type           = discrete
reward_type           = all_links_los
step_size_m           = 1.0
x_min = 0.0
x_max = 100.0
y_min = -50.0
y_max = 100.0
z_min = 0.0
z_max = 50.0

[output]
viz_tick_ms = 100
