# =============================================================================
# Example parameter sweep — frequency x TX power
#
# Runs the static LOS baseline scenario across 3 frequencies and 3 power
# levels (9 sweep points). Each point runs 3 seeds for statistical averaging.
#
# Usage:
#   python -m scripts.sweep.cli --config inputs/sweeps/example.ini
#   python -m scripts.sweep.cli --config inputs/sweeps/example.ini --dry-run
# =============================================================================

[sweep.meta]
# Path to the base scenario directory (must contain run.ini + nodes.json).
# Relative to the mesh-sim root.
base_scenario = inputs/baselines/01-static-los-baseline

# Seeds to run per sweep point (comma-separated).
seeds = 1, 2, 3

# Auto-plot after runs: "each" (per point), "all" (after sweep), or "none".
auto_plot = all

# Plot config to use (relative to mesh-sim root). Leave empty for defaults.
plot_config = scripts/plotting/plot.example.ini

# Label used for the output directory name.
label = freq-power-sweep

[sweep.override]
# Constants applied to ALL sweep points (override the base run.ini).
# Format: section.key = value
scenario.duration_s = 2.0

[sweep]
# Swept dimensions — cartesian product of all lines below.
# Format: section.key = value1, value2, ...
channel.frequency_ghz = 28.0, 39.0, 60.0
channel.tx_power_dbm  = 20.0, 25.0, 30.0
