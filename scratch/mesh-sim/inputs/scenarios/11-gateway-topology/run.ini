# =============================================================================
# 11-gateway-topology — all nodes send to a central gateway
#
# Purpose: validate gateway flow topology. Three peripheral nodes each
# send 100 Mbps to the central gateway. Gateway should show 300 Mbps
# total RX, 0 TX. Each peripheral shows 100 Mbps TX, 0 RX.
#
#   gw:      (0, 0, 10)      — fixed, gateway
#   node-a:  (150, 0, 10)    — fixed
#   node-b:  (0, 150, 10)    — fixed
#   node-c:  (-150, 0, 10)   — fixed
#
# Expected behaviour:
#   - 3 flows: node-a→gw, node-b→gw, node-c→gw
#   - per_node_rx: gw=300, others=0
#   - per_node_tx: gw=0, others=100 each
#   - flow_throughput: 3 flat lines at 100 Mbps
#   - All 1-hop, latency ≈ 0.5 ms each
# =============================================================================

[scenario]
name           = 11-gateway-topology
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model            = constant
demand_mbps      = 100.0
flow_topology    = gateway
gateway_node_id  = gw

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
