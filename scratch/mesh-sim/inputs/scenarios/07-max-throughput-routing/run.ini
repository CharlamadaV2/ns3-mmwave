# =============================================================================
# 07-max-throughput-routing — widest-path (max bottleneck) routing
#
# Purpose: validate max_throughput routing algorithm. Four nodes in a
# diamond with asymmetric link qualities. max_throughput should prefer the
# path with the widest bottleneck, which may differ from shortest_path.
#
#   src:    (0, 0, 10)      — fixed
#   close:  (150, 0, 10)    — fixed, strong link to src (150m)
#   far:    (100, 300, 10)  — fixed, weaker link to src (316m)
#   dst:    (300, 0, 10)    — fixed
#
# Link distances:
#   src→close:  150m (strong)     src→far:  316m (weaker)
#   close→dst:  150m (strong)     far→dst:  361m (weaker)
#   src→dst:    300m (moderate)   close→far: 305m
#
# max_throughput picks the path with the highest minimum-capacity link.
# src→close→dst (bottleneck: 150m link) likely wins over src→dst direct
# (bottleneck: 300m link).
#
# Expected behaviour:
#   - Routing prefers 2-hop src→close→dst over 1-hop src→dst
#   - mean_hop_count > 1.0 in network summary
#   - Compare to re-running with algorithm=shortest_path to see difference
# =============================================================================

[scenario]
name           = 07-max-throughput-routing
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model            = constant
demand_mbps      = 500.0
flow_topology    = gateway
gateway_node_id  = dst

[routing]
algorithm = max_throughput
max_hops  = 5

[output]
viz_tick_ms = 100
