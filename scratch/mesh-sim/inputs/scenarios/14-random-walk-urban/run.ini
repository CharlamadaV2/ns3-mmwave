# =============================================================================
# 14-random-walk-urban — random walk + buildings + gateway relay
#
# Purpose: integration test combining random walk mobility, building
# blockage, gateway traffic, and multi-hop relay. A drone gateway at
# altitude serves two ground-level random walkers moving through an
# urban area with buildings.
#
#   gateway:   (150, 0, 30)  — fixed drone, above buildings
#   walker-a:  starts (50, 50, 1.5)   — random walk, 3 m/s (pedestrian)
#   walker-b:  starts (250, -30, 1.5) — random walk, 5 m/s (jogger)
#
#   Buildings: 2 blocks creating ground-level shadow zones
#
# Expected behaviour:
#   - Gateway links mostly stable (altitude advantage over 22-28m buildings)
#   - Walker↔walker link noisy with LOS/NLOS toggling as they wander
#   - Geometry plots show changing elevation/azimuth angles
#   - Occasional multi-hop relay through gateway when walker links are NLOS
#   - Throughput mostly stable with occasional dips
# =============================================================================

[scenario]
name           = 14-random-walk-urban
seed           = 42
run_id         = 1
duration_s     = 60.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = true
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model            = constant
demand_mbps      = 50.0
flow_topology    = gateway
gateway_node_id  = gateway

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
