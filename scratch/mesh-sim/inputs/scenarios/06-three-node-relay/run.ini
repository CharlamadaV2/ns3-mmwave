# =============================================================================
# 06-three-node-relay — multi-hop path with latency stacking
#
# Purpose: validate multi-hop routing and latency accumulation. Three nodes
# in a line, 500m apart. The end-to-end flow (A→C) may route through the
# relay, giving 2-hop latency vs 1-hop for adjacent pairs.
#
#   node-a:  (0, 0, 10)    — fixed
#   relay:   (500, 0, 10)  — fixed
#   node-c:  (1000, 0, 10) — fixed
#
# Expected behaviour:
#   - A↔relay and relay↔C: strong 1-hop links (~500m LOS)
#   - A↔C: 1000m direct link or 2-hop via relay (routing decides)
#   - Latency: 1-hop flows ≈ 0.5 ms, 2-hop flows ≈ 1.0 ms
#   - per_flow_latency bar chart shows the difference clearly
#   - mean_hop_count > 1.0 in network summary
# =============================================================================

[scenario]
name           = 06-three-node-relay
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMa
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
