# =============================================================================
# five-node-mesh — multi-hop routing with building blockage
#
# Purpose: verify that a building between node0 and node3 causes NLOS on that
# direct link, forcing traffic to route through intermediate nodes.
#
#   node0: (0, 0, 1.5)        node3: (200, 0, 1.5)
#   node1: (100, 50, 1.5)     node4: (150, -40, 1.5)
#   node2: (50, -50, 1.5)
#
#   Building "blocker": x=[80,120], y=[-15,15], z=[0,20]
#     — sits on the direct path between node0 and node3
#     — also partially blocks node0↔node4 depending on geometry
#
# Expected behaviour:
#   - node0↔node3 link is NLOS (building intercepts the straight line)
#   - node0↔node1 and node1↔node3 are LOS (path goes around building)
#   - Routing should find multi-hop paths for blocked pairs
#   - summary.json: mean_hop_count > 1.0 for some flows
# =============================================================================

[scenario]
name           = five-node-mesh
seed           = 42
run_id         = 1
duration_s     = 10.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = true
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
