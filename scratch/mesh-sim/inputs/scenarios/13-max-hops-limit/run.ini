# =============================================================================
# 13-max-hops-limit — max_hops constraint rejects long paths
#
# Purpose: validate the max_hops routing constraint. Five nodes in a chain,
# 200m apart, with low TX power so only adjacent pairs can communicate.
# End-to-end (n0→n4) requires 4 hops, but max_hops=3 rejects it.
#
#   n0: (0, 0, 10)    n1: (200, 0, 10)    n2: (400, 0, 10)
#   n3: (600, 0, 10)  n4: (800, 0, 10)
#
# At tx_power=10 dBm:
#   Max tolerable PL ≈ 10 + 24 + 83 - 6.7 = 110 dB
#   UMi LOS at 200m ≈ 110 dB → marginal (alive)
#   UMi LOS at 400m ≈ 116 dB → dead
#
# So only adjacent links (200m) survive. Routing:
#   n0→n1: 1 hop ✓    n0→n2: 2 hops ✓    n0→n3: 3 hops ✓
#   n0→n4: 4 hops ✗ (exceeds max_hops=3)
#
# Expected behaviour:
#   - network_summary: flows_unroutable > 0
#   - per_flow_throughput: n0→n4 = 0 Mbps
#   - latency: 1-hop ~0.5ms, 2-hop ~1.0ms, 3-hop ~1.5ms
#   - connectivity < 1.0
# =============================================================================

[scenario]
name           = 13-max-hops-limit
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 10.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 3

[output]
viz_tick_ms = 100
