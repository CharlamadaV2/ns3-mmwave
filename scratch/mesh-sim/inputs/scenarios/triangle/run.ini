# =============================================================================
# triangle — basic 3-node mesh connectivity check
#
# Purpose: verify that three LOS peer nodes produce sensible SINR and that
# all-pairs traffic is routed over single-hop direct links.
#
#   node0: (0, 0, 1.5)
#   node1: (100, 0, 1.5)
#   node2: (50, 86.6, 1.5)
#
# All separations ~100 m.  No buildings → all links LOS.
#
# Expected behaviour:
#   - All 3 links are LOS with SINR in the 15-25 dB range (28 GHz UMi, 100 m)
#   - All 6 flows (3 pairs × 2 directions) routed over single hops
#   - Delivered throughput ≈ demand (10 Mbps per flow) if capacity >> demand
# =============================================================================

[scenario]
name           = triangle
seed           = 42
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
