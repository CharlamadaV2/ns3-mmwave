# =============================================================================
# 03-building-blockage — deterministic NLOS→LOS transition via building
#
# Purpose: validate BuildingsChannelConditionModel. node-b starts directly
# behind a building (NLOS to node-a), then moves south to clear the edge.
#
#   node-a:  (0, 0, 1.5)   — fixed, west of building
#   node-b:  (200, 0, 1.5) — moves south at 2 m/s
#
#   Building: x=[90,110], y=[-20,20], z=[0,20]
#
# At t=0: node-b at y=0, directly behind building → NLOS.
# At t~10-12s: node-b at y≈-22, clears the building edge → LOS.
#
# Expected behaviour:
#   - SINR: low/negative during NLOS, sharp jump at ~t=10-12s, then stable
#   - Capacity: near 0 during NLOS, jumps high at transition
#   - Throughput: 0 during NLOS, 10 Mbps once LOS
#   - Geometry: azimuth changes as node-b drifts south
# =============================================================================

[scenario]
name           = 03-building-blockage
seed           = 1
run_id         = 1
duration_s     = 30.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file = buildings.json

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMa
channel_model    = 3gpp
blockage_enabled = true
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
