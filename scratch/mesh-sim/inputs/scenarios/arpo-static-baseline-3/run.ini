[scenario]
name           = arpo-static-baseline-3
seed           = 1
run_id         = 1
duration_s     = 60.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = 3gpp
blockage_enabled = false
amc_model        = table
bandwidth_mhz    = 400.0
noise_figure_db  = 5.0

[traffic]
model         = constant
demand_mbps   = 100.0
flow_topology = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
