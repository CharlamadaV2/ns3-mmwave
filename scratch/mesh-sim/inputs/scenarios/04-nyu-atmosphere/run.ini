# =============================================================================
# 04-nyu-atmosphere — NYU channel model with atmospheric and rain loss
#
# Purpose: validate the NYU propagation code path and its extra loss knobs.
# Two fixed nodes 500m apart with moderate rain (25 mm/hr). Compare output
# numerically to scenario 01 to see the atmospheric penalty.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (500, 0, 10) — fixed
#
# At 28 GHz, atmospheric absorption ≈ 0.1 dB/km, rain at 25 mm/hr adds
# ~5-10 dB/km. Over 500m: ~2.5-5 dB extra loss vs dry conditions.
#
# Expected behaviour:
#   - All time-series are flat (both fixed)
#   - SINR noticeably lower than 3GPP at same geometry (rain penalty)
#   - Validates that NYU model loads and rain/atmospheric parameters apply
# =============================================================================

[scenario]
name           = 04-nyu-atmosphere
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = nyu
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0

[nyu_channel]
shadowing_enabled        = true
atmospheric_loss_enabled = true
foliage_loss_enabled     = false
rain_rate_mm_hr          = 25.0

[traffic]
model          = constant
demand_mbps    = 10.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
