# =============================================================================
# 05-mcs-table-mode — AMC table capacity vs Shannon
#
# Purpose: validate the MCS table code path. At high SINR (200m LOS),
# table capacity should be notably lower than Shannon (~60% of Shannon).
# Compare numerically to scenario 01 at similar SINR.
#
#   node-a:  (0, 0, 10)   — fixed
#   node-b:  (200, 0, 10) — fixed
#
# At CQI 14: spectral efficiency = 5.55 bits/s/Hz
# Table capacity = 5.55 * 400 MHz = 2220 Mbps
# Shannon at same SINR (~25-30 dB) ≈ 3500-4000 Mbps
#
# Expected behaviour:
#   - All time-series flat (both fixed)
#   - Capacity ≈ 2220 Mbps (table mode), much lower than Shannon
#   - MCS flat at CQI 14
#   - Throughput = 500 Mbps (demand fully met, capacity >> demand)
# =============================================================================

[scenario]
name           = 05-mcs-table-mode
seed           = 1
run_id         = 1
duration_s     = 5.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = UMi
channel_model    = 3gpp
blockage_enabled = false
bandwidth_mhz   = 400.0
noise_figure_db  = 5.0
amc_model        = table

[traffic]
model          = constant
demand_mbps    = 500.0
flow_topology  = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
