# =============================================================================
# Reproduce:
#   # from ns3 root
#   ./build/scratch/mesh-sim/ns3*-sim-* \
#     --run-config=scratch/mesh-sim/inputs/scenarios/arpo-1-1-static-04172026/run.ini
#
#   # from scratch/mesh-sim
#   python3 -m scripts.validation.compare 1-1_static_04172026 --rab-pair rab1,rab3
# =============================================================================

[scenario]
name           = arpo-1-1-static-04172026
seed           = 1
run_id         = 1
duration_s     = 60.0
warmup_s       = 0.0
tick_s         = 0.1
nodes_file     = nodes.json
buildings_file =

[channel]
frequency_ghz    = 28.0
tx_power_dbm     = 30.0
scenario         = RMa
channel_model    = nyu
blockage_enabled = false
amc_model        = table
bandwidth_mhz    = 400.0
noise_figure_db  = 5.0

[traffic]
model         = constant
demand_mbps   = 100.0
flow_topology = all_pairs

[routing]
algorithm = shortest_path
max_hops  = 5

[output]
viz_tick_ms = 100
