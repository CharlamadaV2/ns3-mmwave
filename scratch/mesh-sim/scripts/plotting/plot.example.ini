[output]
# Path to the run output directory containing seed-N/ subdirectories.
data_dir = outputs/2026-03/31/13-18-22

# Image format and resolution.
format = png
dpi = 300

[plots]
# Time-series (from CSV files, x-axis = simulation time)
sinr_timeseries = true
rx_power_timeseries = true
capacity_timeseries = true
mcs_timeseries = true
throughput_timeseries = true
latency_timeseries = true
geometry = true

# Summary (from summary.json, bar charts / tables)
per_node_sinr = true
per_node_throughput = true
per_flow_throughput = true
per_flow_latency = true
network_summary = true
sim_runtime = true
